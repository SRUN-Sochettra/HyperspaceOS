<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperSpace — Browser-native desktop</title>
    <link rel="icon" href="/hyperspace-mark.svg" type="image/svg+xml" />

  </head>

  <body>
    <div id="boot-screen">
      <div class="boot-logo" aria-label="HyperSpace"><img src="/hyperspace-mark.svg" alt="" width="68" height="68"></div>
      <div class="boot-text">HyperSpace</div>
      <div class="boot-subtext">A browser-native desktop environment</div>
      <div class="boot-progress">
        <div class="boot-progress-bar" id="boot-bar"></div>
      </div>
    </div>

    <canvas id="canvas-bg"></canvas>
    <div id="environment-layer"></div>
    <div id="statusbar"></div>
    <div id="window-layer"></div>
    <div id="dock"></div>
    <div id="notification-container"></div>
    <div id="context-menu-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
