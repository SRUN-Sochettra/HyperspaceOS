<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperSpace OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020206;
        font-family:
          "Inter",
          -apple-system,
          system-ui,
          sans-serif;
        color: rgba(235, 235, 255, 0.92);
        -webkit-font-smoothing: antialiased;
      }

      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #020206;
        transition:
          opacity 0.9s ease,
          visibility 0.9s ease;
      }

      #boot-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-logo {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        background: linear-gradient(135deg, #00f5ff 0%, #b400ff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        animation: pulse 2.5s ease-in-out infinite;
        box-shadow: 0 0 48px rgba(0, 245, 255, 0.15);
      }

      .boot-logo-letter {
        font-size: 30px;
        font-weight: 700;
        color: white;
        letter-spacing: -1px;
      }

      .boot-text {
        font-size: 10px;
        color: rgba(190, 195, 230, 0.4);
        letter-spacing: 7px;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 3px;
      }

      .boot-subtext {
        font-size: 9px;
        color: rgba(170, 175, 210, 0.2);
        letter-spacing: 3px;
        margin-bottom: 24px;
        font-weight: 400;
      }

      .boot-progress {
        width: 160px;
        height: 1.5px;
        background: rgba(255, 255, 255, 0.035);
        border-radius: 1px;
        overflow: hidden;
        margin-bottom: 24px;
      }

      .boot-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00f5ff, #b400ff);
        border-radius: 1px;
        transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .boot-version {
        font-size: 8px;
        color: rgba(170, 175, 210, 0.12);
        letter-spacing: 2px;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 48px rgba(0, 245, 255, 0.15);
        }

        50% {
          transform: scale(1.025);
          box-shadow: 0 0 64px rgba(0, 245, 255, 0.22);
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-screen">
      <div class="boot-logo"><span class="boot-logo-letter">H</span></div>
      <div class="boot-text">HYPERSPACE</div>
      <div class="boot-subtext">Operating System</div>
      <div class="boot-progress">
        <div class="boot-progress-bar" id="boot-bar"></div>
      </div>
      <div class="boot-version">v2.0.0</div>
    </div>

    <canvas id="canvas-bg"></canvas>
    <div id="environment-layer"></div>
    <div id="statusbar"></div>
    <div id="window-layer"></div>
    <div id="dock"></div>
    <div id="notification-container"></div>
    <div id="context-menu-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
